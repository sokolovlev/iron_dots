[package]
name = "client"
description = "Iron Dots game client: window, input, UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "iron-dots"
path = "src/main.rs"

[dependencies]
sim-core.workspace = true
ai.workspace = true
render.workspace = true
wgpu.workspace = true
winit.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
pollster.workspace = true
png.workspace = true

tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }

[features]
# Live profiling in Tracy (spec 4.4): spans for every tick phase.
# Build with `--features tracy` and connect the Tracy profiler.
tracy = ["sim-core/tracing", "dep:tracing", "dep:tracing-subscriber", "dep:tracing-tracy"]

[lints]
workspace = true
