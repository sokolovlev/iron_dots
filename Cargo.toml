[workspace]
resolver = "3"
members = ["crates/simd-kernels", "crates/pathing", "crates/sim-core", "crates/ai", "crates/render", "crates/client", "crates/headless", "crates/net", "crates/relay-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sokolovlev/iron_dots"
rust-version = "1.85"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
simd-kernels = { path = "crates/simd-kernels" }
pathing = { path = "crates/pathing" }
net = { path = "crates/net" }
relay-server = { path = "crates/relay-server" }
ai = { path = "crates/ai" }
render = { path = "crates/render" }
wgpu = "30"
winit = "0.30.13"
egui = { version = "0.37", features = ["default_fonts"] }
egui-wgpu = { version = "0.37", features = ["winit"] }
egui-winit = "0.37"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
png = "0.18"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
bitcode = { version = "0.6", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
proptest = "1"
rayon = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-tracy = "0.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Simulation tests run thousands of ticks; unoptimised builds are too slow.
[profile.dev]
opt-level = 1

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
