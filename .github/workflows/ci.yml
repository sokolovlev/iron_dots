name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Stage 1 exit criterion: the same replays give the same hashes everywhere.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Cross-platform replay hash
        shell: bash
        run: |
          cargo run --release -p headless -- hash --map 256 --units 500 --players 4 --seed 3 --ticks 3000 > hash.txt
          cat hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.os }}
          path: hash.txt

  compare-hashes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
      - name: All platforms must agree
        run: |
          for f in hash-*/hash.txt; do echo "$f: $(cat $f)"; done
          test "$(cat hash-*/hash.txt | sort -u | wc -l)" = 1

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p headless -- bench --map 1024 --units 5000 --players 2 --ticks 600
      - run: cargo run --release -p headless -- bench --map 1024 --units 5000 --players 2 --ticks 600 --threads 4
      - run: cargo run --release -p headless -- bench --map 256 --units 2000 --players 4 --ticks 1200 --threads 4
      - run: cargo run --release -p headless -- bench --map 4096 --units 12500 --players 8 --ticks 150 --threads 4
      # Tracy instrumentation must keep compiling.
      - run: cargo build --release -p headless --features tracy
      # Stage 2 exit criterion, automated: bots play a full match to victory.
      - run: cargo run --release -p headless -- match --map 256 --players 2 --seed 1 --ticks 45000

  # Renders a real frame (map, units, HUD) with a software Vulkan driver and
  # keeps it as an artifact, so rendering regressions are visible in PRs.
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo run --release -p client -- --screenshot overview.png --map 256 --ticks 4500 --seed 1
      - run: cargo run --release -p client -- --screenshot closeup.png --map 256 --ticks 6000 --seed 2 --opponents 2 --zoom 9
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: "*.png"
