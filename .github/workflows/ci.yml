name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Stage 1 exit criterion: the same replays give the same hashes everywhere.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release
      - name: Cross-platform replay hash
        shell: bash
        run: |
          cargo run --release -p headless -- hash --map 256 --units 500 --players 4 --seed 3 --ticks 3000 > hash.txt
          cat hash.txt
      - uses: actions/upload-artifact@v4
        with:
          name: hash-${{ matrix.os }}
          path: hash.txt

  compare-hashes:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hash-*
      - name: All platforms must agree
        run: |
          for f in hash-*/hash.txt; do echo "$f: $(cat $f)"; done
          test "$(cat hash-*/hash.txt | sort -u | wc -l)" = 1

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --release -p headless -- bench --map 1024 --units 5000 --players 2 --ticks 600
      - run: cargo run --release -p headless -- bench --map 256 --units 2000 --players 4 --ticks 1200
